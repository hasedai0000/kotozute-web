# ローカル開発用の compose 骨組み。
# - web: Next.js（standalone）を Dockerfile からビルドして起動
# - api: 別リポジトリ ../kotozute-api を build context として参照（未 clone 時は起動しない）
# - db / redis: api が依存するミドルウェア
#
# 既定では web のみ起動。api スタックを立ち上げるときは:
#   docker compose --profile api up
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* はビルド時に inline されるため build args で渡す。
      # ${VAR} は compose 実行時に .env から解決される。
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: kotozute-web:local
    container_name: kotozute-web-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    restart: unless-stopped

  api:
    profiles: ["api"]
    build:
      context: ../kotozute-api
      dockerfile: Dockerfile
    image: kotozute-api:local
    container_name: kotozute-api
    ports:
      - "8000:8000"
    env_file:
      - ../kotozute-api/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    profiles: ["api"]
    image: postgres:16-alpine
    container_name: kotozute-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kotozute
      POSTGRES_PASSWORD: kotozute
      POSTGRES_DB: kotozute
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kotozute -d kotozute"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    profiles: ["api"]
    image: redis:7-alpine
    container_name: kotozute-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
